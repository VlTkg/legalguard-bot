<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalGuard Bot</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0; padding: 20px; background-color: #f4f6f9; color: #333;
    }
    .container { max-width: 800px; margin: 0 auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h1 { margin-top: 0; color: #1a202c; font-size: 24px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: 600; margin-bottom: 5px; }
    textarea, select, input[type="file"] { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; box-sizing: border-box; }
    textarea { height: 120px; resize: vertical; }
    button.btn-submit { background-color: #3182ce; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; font-weight: 600; }
    button.btn-submit:hover { background-color: #2b6cb0; }
    
    /* Result Section */
    #result-section { margin-top: 25px; display: none; }
    .card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 15px; }
    .risk-high { border-left: 4px solid #e53e3e; }
    .risk-medium { border-left: 4px solid #dd6b20; }
    .risk-low { border-left: 4px solid #38a169; }
    
    /* Feedback Section */
    .feedback-box { margin-top: 30px; padding: 20px; background: #f7fafc; border: 1px dashed #cbd5e0; border-radius: 8px; }
    .feedback-box h3 { margin-top: 0; font-size: 18px; color: #2d3748; }
    .stars { display: flex; gap: 5px; font-size: 24px; cursor: pointer; margin-bottom: 10px; }
    .star { color: #cbd5e0; transition: color 0.2s; }
    .star.active { color: #f6ad55; }
    .thumbs { display: flex; gap: 15px; margin-bottom: 15px; }
    .thumb-btn { background: #edf2f7; border: 1px solid #cbd5e0; padding: 8px 15px; border-radius: 6px; cursor: pointer; font-size: 18px; }
    .thumb-btn.active { background: #e2e8f0; border-color: #4a5568; }
    .fb-type-selector { display: flex; gap: 10px; margin-bottom: 10px; }
    .fb-type-btn { padding: 6px 12px; border: 1px solid #cbd5e0; border-radius: 20px; background: #fff; cursor: pointer; font-size: 13px; }
    .fb-type-btn.active { background: #3182ce; color: #fff; border-color: #3182ce; }
  </style>
</head>
<body>

<div class="container">
  <h1>LegalGuard — Анализ договоров</h1>
  
  <form id="analyze-form">
    <div class="form-group">
      <label>Загрузить файл (PDF, DOCX, ODT, TXT):</label>
      <input type="file" id="file-input" accept=".pdf,.docx,.doc,.odt,.txt">
    </div>
    
    <div class="form-group">
      <label>Или вставьте текст договора:</label>
      <textarea id="text-input" placeholder="Вставьте текст..."></textarea>
    </div>

    <div class="form-group">
      <label>Юрисдикция:</label>
      <select id="jurisdiction">
        <option value="RU">Россия (РФ)</option>
        <option value="KZ">Казахстан</option>
        <option value="BY">Беларусь</option>
      </select>
    </div>

    <button type="submit" class="btn-submit" id="submit-btn">Анализировать договор</button>
  </form>

  <!-- Результаты -->
  <div id="result-section">
    <h2 id="doc-title">Результат анализа</h2>
    <div id="risks-list"></div>

    <!-- Блок Обратной Связи -->
    <div class="feedback-box">
      <h3>Оцените качество анализа и работу сервиса</h3>
      
      <!-- Выбор типа обратной связи -->
      <div class="fb-type-selector">
        <button type="button" class="fb-type-btn active" data-type="quality">Оценка качества</button>
        <button type="button" class="fb-type-btn" data-type="tech_issue">Технический вопрос / Баг</button>
      </div>

      <!-- Звезды -->
      <div class="stars" id="star-rating">
        <span class="star" data-value="1">★</span>
        <span class="star" data-value="2">★</span>
        <span class="star" data-value="3">★</span>
        <span class="star" data-value="4">★</span>
        <span class="star" data-value="5">★</span>
      </div>

      <!-- Большой палец -->
      <div class="thumbs">
        <button type="button" class="thumb-btn" id="thumb-up">👍 Полезно</button>
        <button type="button" class="thumb-btn" id="thumb-down">👎 Есть ошибки</button>
      </div>

      <!-- Текстовый отзыв / Техническая проблема -->
      <div class="form-group">
        <textarea id="feedback-comment" placeholder="Ваш отзыв или описание технической проблемы..."></textarea>
      </div>

      <button type="button" class="btn-submit" id="send-feedback-btn" style="background-color: #38a169;">Отправить отзыв</button>
      <p id="feedback-status" style="margin-top: 10px; font-weight: 600; display: none;"></p>
    </div>
  </div>
</div>

<script>
  let selectedRating = 0;
  let selectedThumb = null;
  let feedbackCategory = 'quality';

  // Обработка клика по звездам
  document.querySelectorAll('#star-rating .star').forEach(star => {
    star.addEventListener('click', (e) => {
      selectedRating = parseInt(e.target.getAttribute('data-value'));
      document.querySelectorAll('#star-rating .star').forEach((s, idx) => {
        if (idx < selectedRating) s.classList.add('active');
        else s.classList.remove('active');
      });
    });
  });

  // Обработка лайк/дизлайк
  document.getElementById('thumb-up').addEventListener('click', () => {
    selectedThumb = 'up';
    document.getElementById('thumb-up').classList.add('active');
    document.getElementById('thumb-down').classList.remove('active');
  });

  document.getElementById('thumb-down').addEventListener('click', () => {
    selectedThumb = 'down';
    document.getElementById('thumb-down').classList.add('active');
    document.getElementById('thumb-up').classList.remove('active');
  });

  // Выбор типа обратной связи (Качество / Технический баг)
  document.querySelectorAll('.fb-type-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.fb-type-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      feedbackCategory = e.target.getAttribute('data-type');
      
      const commentBox = document.getElementById('feedback-comment');
      if (feedbackCategory === 'tech_issue') {
        commentBox.placeholder = "Опишите проблему (например: долго грузит, файл ODT не открывается, сбой в интерфейсе)...";
      } else {
        commentBox.placeholder = "Ваш отзыв о качестве проверки...";
      }
    });
  });

  // Отправка формы анализа
  document.getElementById('analyze-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = "Анализируем договор...";

    const formData = new FormData();
    const fileInput = document.getElementById('file-input');
    if (fileInput.files.length > 0) {
      formData.append('file', fileInput.files[0]);
    }
    formData.append('text', document.getElementById('text-input').value);
    formData.append('jurisdiction', document.getElementById('jurisdiction').value);

    try {
      const resp = await fetch('/api/analyze', { method: 'POST', body: formData });
      const data = await resp.json();
      
      document.getElementById('doc-title').innerText = data.doc_title || "Результат анализа";
      const risksContainer = document.getElementById('risks-list');
      risksContainer.innerHTML = '';

      if (data.risks) {
        data.risks.forEach(r => {
          const card = document.createElement('div');
          card.className = `card risk-${r.level === 'high' ? 'high' : (r.level === 'med' ? 'medium' : 'low')}`;
          card.innerHTML = `
            <strong>Пункт:</strong> ${r.clause || 'Общий риск'}<br>
            <strong>Комментарий:</strong> ${r.comment}<br>
            ${r.proposed ? `<strong>Предложение:</strong> ${r.proposed}` : ''}
          `;
          risksContainer.appendChild(card);
        });
      }

      document.getElementById('result-section').style.display = 'block';
    } catch (err) {
      alert("Ошибка запроса: " + err);
    } finally {
      btn.disabled = false;
      btn.innerText = "Анализировать договор";
    }
  });

  // Отправка отзыва
  document.getElementById('send-feedback-btn').addEventListener('click', async () => {
    const comment = document.getElementById('feedback-comment').value;
    const statusText = document.getElementById('feedback-status');

    const payload = {
      category: feedbackCategory,
      rating: selectedRating,
      thumb: selectedThumb,
      comment: comment
    };

    try {
      const resp = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (resp.ok) {
        statusText.style.color = 'green';
        statusText.innerText = 'Спасибо! Ваш отзыв успешно отправлен.';
        statusText.style.display = 'block';
      } else {
        throw new Error('Ошибка сохранения');
      }
    } catch (e) {
      statusText.style.color = 'red';
      statusText.innerText = 'Не удалось отправить отзыв. Попробуйте еще раз.';
      statusText.style.display = 'block';
    }
  });
</script>

</body>
</html>
