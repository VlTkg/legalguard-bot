<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LegalGuard — Экспресс-Анализ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f5f7);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1c1e21);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #248277);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --high-risk: #ff3b30;
            --med-risk: #ff9500;
            --low-risk: #34c759;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            box-sizing: border-box;
            -webkit-user-select: none;
            user-select: none;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            margin: 0 0 6px 0;
            font-weight: 700;
        }

        .header p {
            color: var(--hint-color);
            font-size: 14px;
            margin: 0;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-card {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .summary-card .number {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .summary-card .label {
            font-size: 11px;
            color: var(--hint-color);
            text-transform: uppercase;
            font-weight: 600;
        }

        .summary-card.high .number { color: var(--high-risk); }
        .summary-card.med .number { color: var(--med-risk); }
        .summary-card.low .number { color: var(--low-risk); }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 20px 0 12px 0;
        }

        .risk-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 5px solid transparent;
        }

        .risk-card.high { border-left-color: var(--high-risk); }
        .risk-card.med { border-left-color: var(--med-risk); }
        .risk-card.low { border-left-color: var(--low-risk); }

        .risk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 15px;
            margin-bottom: 8px;
        }

        .risk-badge {
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 600;
            color: #fff;
        }

        .badge-high { background-color: var(--high-risk); }
        .badge-med { background-color: var(--med-risk); }
        .badge-low { background-color: var(--low-risk); }

        .risk-body {
            font-size: 13px;
            line-height: 1.5;
        }

        .text-block {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: rgba(0,0,0,0.03);
            border-radius: 8px;
            font-size: 12px;
        }

        .text-block-title {
            font-weight: 600;
            color: var(--hint-color);
            margin-bottom: 4px;
            font-size: 11px;
            text-transform: uppercase;
        }

        .copy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }

        /* Блок обратной связи по пункту */
        .clause-feedback {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
            padding-top: 8px;
            border-top: 1px solid rgba(142, 142, 147, 0.15);
            font-size: 12px;
            color: var(--hint-color);
        }

        .vote-btns {
            display: flex;
            gap: 6px;
        }

        .vote-btn {
            background: none;
            border: 1px solid var(--hint-color);
            border-radius: 6px;
            padding: 3px 8px;
            cursor: pointer;
            font-size: 12px;
            color: var(--text-color);
        }

        /* Общий блок оценки работы бота */
        .rating-section {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-top: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .rating-stars {
            font-size: 26px;
            margin: 10px 0;
            cursor: pointer;
            letter-spacing: 4px;
        }

        #loading, #error {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="loading">Загрузка юридического отчета...</div>
    <div id="error" style="display: none;"></div>

    <div id="content" style="display: none;">
        <div class="header">
            <h1 id="doc-title">Договор</h1>
            <p>Интерактивный экспресс-анализ рисков</p>
        </div>

        <div class="summary-cards">
            <div class="summary-card high">
                <div class="number" id="count-high">0</div>
                <div class="label">Высокие</div>
            </div>
            <div class="summary-card med">
                <div class="number" id="count-med">0</div>
                <div class="label">Средние</div>
            </div>
            <div class="summary-card low">
                <div class="number" id="count-low">0</div>
                <div class="label">Низкие</div>
            </div>
        </div>

        <div class="section-title">Детальный разбор рисков</div>
        <div id="risks-list"></div>

        <!-- Оценка сервиса -->
        <section class="rating-section">
            <div style="font-weight: 600; font-size: 14px;">Оцените качество разбора</div>
            <div class="rating-stars" onclick="rateAnalysis(event)">⭐⭐⭐⭐⭐</div>
            <div id="rating-status" style="font-size: 12px; color: var(--hint-color);">Нажмите на звезду для оценки</div>
        </section>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : null);

        if (!userId) {
            showError("Не удалось определить ID пользователя. Откройте отчет через бота LegalGuard.");
        } else {
            fetchReport(userId);
        }

        async function fetchReport(uid) {
            try {
                const response = await fetch(`/api/report?user_id=${uid}`);
                if (!response.ok) {
                    throw new Error("Отчет не найден или устарел. Отправьте файл заново.");
                }
                const data = await response.json();
                renderReport(data);
            } catch (err) {
                showError(err.message);
            }
        }

        function showError(msg) {
            document.getElementById('loading').style.display = 'none';
            const errDiv = document.getElementById('error');
            errDiv.innerText = msg;
            errDiv.style.display = 'block';
        }

        function renderReport(data) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('content').style.display = 'block';

            document.getElementById('doc-title').innerText = data.doc_title || 'Анализ Договора';
            document.getElementById('count-high').innerText = data.summary.high || 0;
            document.getElementById('count-med').innerText = data.summary.medium || 0;
            document.getElementById('count-low').innerText = data.summary.low || 0;

            const listContainer = document.getElementById('risks-list');
            listContainer.innerHTML = '';

            if (!data.risks || data.risks.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color: var(--hint-color); padding: 20px;">Критических рисков не обнаружено.</div>';
                return;
            }

            data.risks.forEach((risk) => {
                const card = document.createElement('div');
                card.className = `risk-card ${risk.level}`;

                const levelText = risk.level === 'high' ? 'Высокий risk' : (risk.level === 'med' ? 'Средний risk' : 'Низкий risk');
                const badgeClass = `badge-${risk.level}`;

                card.innerHTML = `
                    <div class="risk-header">
                        <span>Пункт: ${escapeHtml(risk.clause)}</span>
                        <span class="risk-badge ${badgeClass}">${levelText}</span>
                    </div>
                    <div class="risk-body">
                        <div style="margin-bottom: 6px;">${escapeHtml(risk.comment)}</div>
                        <div class="text-block">
                            <div class="text-block-title">Исходная формулировка:</div>
                            <i>"${escapeHtml(risk.original)}"</i>
                        </div>
                        <div class="text-block">
                            <div class="text-block-title">Предлагаемая правка:</div>
                            <b>"${escapeHtml(risk.proposed)}"</b>
                        </div>
                        <button class="copy-btn" onclick="copyToClipboard('${escapeJs(risk.proposed)}')">Скопировать правку</button>
                        
                        <div class="clause-feedback">
                            <span>Полезен разбор?</span>
                            <div class="vote-btns">
                                <button class="vote-btn" onclick="sendVote(${risk.id}, 'like', this)">👍</button>
                                <button class="vote-btn" onclick="sendVote(${risk.id}, 'dislike', this)">👎</button>
                            </div>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                if (tg.HapticFeedback) {
                    tg.HapticFeedback.notificationOccurred('success');
                }
                tg.showAlert("Предлагаемая правка скопирована в буфер обмена!");
            });
        }

        function sendVote(clauseId, type, btnElement) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.impactOccurred('light');
            }
            tg.sendData(JSON.stringify({ action: "clause_vote", clause_id: clauseId, vote: type }));
            
            const parent = btnElement.parentElement;
            parent.innerHTML = '<span style="color: var(--low-risk); font-weight:600;">Спасибо за отзыв!</span>';
        }

        function rateAnalysis(e) {
            if (tg.HapticFeedback) {
                tg.HapticFeedback.notificationOccurred('success');
            }
            document.getElementById('rating-status').innerText = 'Спасибо за Вашу оценку! ❤️';
            tg.sendData(JSON.stringify({ action: "rating", stars: 5 }));
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function escapeJs(str) {
            return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
        }
    </script>
</body>
</html>
