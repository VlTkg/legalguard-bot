<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LegalGuard — Экспресс-анализ договоров</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }

    /* Двухколоночный макет во всё окно */
    .app-layout {
      display: grid;
      grid-template-columns: 1fr 340px;
      align-items: stretch;
      gap: 20px;
      padding: 16px;
      min-height: 100vh;
      width: 100%;
    }

    /* Левая колонка — Анализ */
    .main-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    #analyze-form {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
      gap: 14px;
    }

    .form-fields {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    /* Правая колонка — Обратная связь */
    .sidebar-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .sidebar-content {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      color: #1a202c;
      font-size: 22px;
    }

    h2 {
      font-size: 16px;
      color: #2d3748;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    label, .section-label {
      font-weight: 600;
      color: #2d3748;
      font-size: 14px;
    }

    textarea, input[type="file"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #cbd5e0;
      border-radius: 8px;
      font-size: 14px;
      background-color: #fff;
    }

    textarea {
      height: 180px;
      resize: vertical;
      font-family: inherit;
    }

    /* Кнопки переключателей */
    .button-selector {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .option-btn {
      padding: 6px 12px;
      border: 1px solid #cbd5e0;
      border-radius: 16px;
      background: #edf2f7;
      color: #4a5568;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: all 0.2s ease;
    }

    .option-btn:hover {
      background: #e2e8f0;
    }

    .option-btn.active {
      background: #3182ce;
      color: #ffffff;
      border-color: #3182ce;
    }

    /* Основные кнопки */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 6px;
    }

    button.btn-submit {
      flex: 2;
      background-color: #3182ce;
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    button.btn-submit:hover {
      background-color: #2b6cb0;
    }

    button.btn-reset {
      flex: 1;
      background-color: #e2e8f0;
      color: #4a5568;
      border: none;
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    button.btn-reset:hover {
      background-color: #cbd5e0;
    }

    /* Результаты */
    #result-section {
      margin-top: 10px;
      display: none;
      border-top: 2px solid #edf2f7;
      padding-top: 15px;
    }

    .card {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
      line-height: 1.4;
      font-size: 14px;
    }

    .risk-high { border-left: 5px solid #e53e3e; }
    .risk-medium { border-left: 5px solid #dd6b20; }
    .risk-low { border-left: 5px solid #38a169; }

    /* Элементы обратной связи */
    .stars {
      display: flex;
      gap: 6px;
      font-size: 22px;
      cursor: pointer;
    }

    .star {
      color: #cbd5e0;
      transition: color 0.2s;
    }

    .star.active {
      color: #f6ad55;
    }

    .thumbs {
      display: flex;
      gap: 10px;
    }

    .thumb-btn {
      flex: 1;
      background: #fff;
      border: 1px solid #cbd5e0;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }

    .thumb-btn.active {
      background: #edf2f7;
      border-color: #3182ce;
      color: #3182ce;
    }

    .fb-type-selector {
      display: flex;
      gap: 8px;
    }

    .fb-type-btn {
      flex: 1;
      padding: 6px 8px;
      border: 1px solid #cbd5e0;
      border-radius: 16px;
      background: #fff;
      cursor: pointer;
      font-size: 12px;
      text-align: center;
    }

    .fb-type-btn.active {
      background: #4a5568;
      color: #fff;
      border-color: #4a5568;
    }

    .feedback-note {
      font-size: 12px;
      color: #718096;
      line-height: 1.35;
      margin-bottom: 8px;
      text-align: center;
    }

    /* Отдельный стиль для кнопки отправки отзыва */
    .btn-feedback-submit {
      background-color: #38a169;
      color: #fff;
      border: none;
      padding: 10px 16px;
      font-size: 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: background-color 0.2s;
    }

    .btn-feedback-submit:hover {
      background-color: #2f855a;
    }

    /* Адаптируемость для телефонов и Telegram */
    @media (max-width: 850px) {
      .app-layout {
        grid-template-columns: 1fr;
      }
      .sidebar-card, .main-card {
        height: auto;
      }
    }
  </style>
</head>
<body>

<div class="app-layout">
  <!-- ЛЕВАЯ КОЛОНКА -->
  <div class="main-card">
    <h1>LegalGuard — Экспресс-анализ договоров</h1>

    <form id="analyze-form">
      <div class="form-fields">
        <div class="form-group">
          <label>Тип договора / Занятость:</label>
          <div class="button-selector" id="category-selector">
            <button type="button" class="option-btn cat-btn active" data-value="general">Общий договор</button>
            <button type="button" class="option-btn cat-btn" data-value="employment">Трудовой договор</button>
            <button type="button" class="option-btn cat-btn" data-value="gph">Договор ГПХ / Услуги</button>
            <button type="button" class="option-btn cat-btn" data-value="rent">Аренда</button>
            <button type="button" class="option-btn cat-btn" data-value="supply">Поставка / Купля-продажа</button>
          </div>
          <input type="hidden" id="selected-category" value="general">
        </div>

        <div class="form-group">
          <label>Юрисдикция:</label>
          <div class="button-selector" id="jurisdiction-selector">
            <button type="button" class="option-btn jur-btn active" data-value="RU">Российская Федерация (РФ)</button>
            <button type="button" class="option-btn jur-btn" data-value="KZ">Республика Казахстан (РК)</button>
            <button type="button" class="option-btn jur-btn" data-value="BY">Республика Беларусь (РБ)</button>
          </div>
          <input type="hidden" id="selected-jurisdiction" value="RU">
        </div>

        <div class="form-group">
          <label>Загрузить файл (PDF, DOCX, ODT, TXT):</label>
          <input type="file" id="file-input" accept=".pdf,.docx,.doc,.odt,.txt">
        </div>

        <div class="form-group">
          <label>Или вставьте текстовый фрагмент договора:</label>
          <textarea id="text-input" placeholder="Вставьте текст договора здесь..."></textarea>
        </div>
      </div>

      <div class="btn-group">
        <button type="submit" class="btn-submit" id="submit-btn">Анализировать</button>
        <button type="button" class="btn-reset" id="reset-btn">Новый анализ</button>
      </div>
    </form>

    <div id="result-section">
      <h2 id="doc-title" style="margin-bottom: 10px;">Результат анализа</h2>
      <div id="risks-list"></div>
    </div>
  </div>

  <!-- ПРАВАЯ КОЛОНКА (ОБРАТНАЯ СВЯЗЬ ДОСТУПНА ВСЕГДА) -->
  <div class="sidebar-card">
    <div class="sidebar-content">
      <h2>Обратная связь</h2>

      <div class="form-group">
        <div class="section-label">Тип обращения:</div>
        <div class="fb-type-selector">
          <button type="button" class="fb-type-btn active" data-type="quality">Оценка анализа</button>
          <button type="button" class="fb-type-btn" data-type="tech_issue">Баг / Ошибка</button>
        </div>
      </div>

      <div class="form-group">
        <div class="section-label">Оценка сервиса:</div>
        <div class="stars" id="star-rating">
          <span class="star" data-value="1">★</span>
          <span class="star" data-value="2">★</span>
          <span class="star" data-value="3">★</span>
          <span class="star" data-value="4">★</span>
          <span class="star" data-value="5">★</span>
        </div>
      </div>

      <div class="thumbs">
        <button type="button" class="thumb-btn" id="thumb-up">👍 Полезно</button>
        <button type="button" class="thumb-btn" id="thumb-down">👎 Есть замечания</button>
      </div>

      <div class="form-group">
        <textarea id="feedback-comment" style="height: 90px;" placeholder="Ваш отзыв или описание проблемы..."></textarea>
      </div>
    </div>

    <div>
      <p class="feedback-note">Ваш отзыв очень важен для нас! Он помогает улучшать качество проверки документов.</p>
      <button type="button" class="btn-feedback-submit" id="send-feedback-btn">Отправить отзыв</button>
      <p id="feedback-status" style="margin-top: 4px; font-weight: 600; font-size: 13px; display: none; text-align: center;"></p>
    </div>
  </div>
</div>

<script>
  // Инициализация Telegram WebApp
  if (window.Telegram && window.Telegram.WebApp) {
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  }

  let selectedRating = 0;
  let selectedThumb = null;
  let feedbackCategory = 'quality';

  // Переключение кнопок категории договора
  document.querySelectorAll('.cat-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('selected-category').value = e.target.getAttribute('data-value');
    });
  });

  // Переключение кнопок юрисдикции
  document.querySelectorAll('.jur-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.jur-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById('selected-jurisdiction').value = e.target.getAttribute('data-value');
    });
  });

  // Кнопка Сброса
  document.getElementById('reset-btn').addEventListener('click', () => {
    document.getElementById('analyze-form').reset();
    document.getElementById('text-input').value = '';
    document.getElementById('file-input').value = '';

    const resultSection = document.getElementById('result-section');
    resultSection.style.display = 'none';
    document.getElementById('risks-list').innerHTML = '';

    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.cat-btn[data-value="general"]').classList.add('active');
    document.getElementById('selected-category').value = 'general';

    document.querySelectorAll('.jur-btn').forEach(b => b.classList.remove('active'));
    document.querySelector('.jur-btn[data-value="RU"]').classList.add('active');
    document.getElementById('selected-jurisdiction').value = 'RU';
  });

  // Обработка звезд
  document.querySelectorAll('#star-rating .star').forEach(star => {
    star.addEventListener('click', (e) => {
      selectedRating = parseInt(e.target.getAttribute('data-value'));
      document.querySelectorAll('#star-rating .star').forEach((s, idx) => {
        if (idx < selectedRating) s.classList.add('active');
        else s.classList.remove('active');
      });
    });
  });

  // Лайк / Дизлайк
  document.getElementById('thumb-up').addEventListener('click', () => {
    selectedThumb = selectedThumb === 'up' ? null : 'up';
    document.getElementById('thumb-up').classList.toggle('active', selectedThumb === 'up');
    document.getElementById('thumb-down').classList.remove('active');
  });

  document.getElementById('thumb-down').addEventListener('click', () => {
    selectedThumb = selectedThumb === 'down' ? null : 'down';
    document.getElementById('thumb-down').classList.toggle('active', selectedThumb === 'down');
    document.getElementById('thumb-up').classList.remove('active');
  });

  // Переключение типа отзыва
  document.querySelectorAll('.fb-type-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
      document.querySelectorAll('.fb-type-btn').forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      feedbackCategory = e.target.getAttribute('data-type');

      const commentBox = document.getElementById('feedback-comment');
      if (feedbackCategory === 'tech_issue') {
        commentBox.placeholder = "Опишите проблему (ошибка чтения файла, сбой и т.д.)...";
      } else {
        commentBox.placeholder = "Ваш отзыв или предложение...";
      }
    });
  });

  // Отправка формы анализа
  document.getElementById('analyze-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = "Анализируем...";

    const formData = new FormData();
    const fileInput = document.getElementById('file-input');
    if (fileInput.files.length > 0) {
      formData.append('file', fileInput.files[0]);
    }
    formData.append('text', document.getElementById('text-input').value);
    formData.append('jurisdiction', document.getElementById('selected-jurisdiction').value);
    formData.append('category', document.getElementById('selected-category').value);

    try {
      const resp = await fetch('/api/analyze', { method: 'POST', body: formData });
      const data = await resp.json();

      document.getElementById('doc-title').innerText = data.doc_title || "Результат анализа";
      const risksContainer = document.getElementById('risks-list');
      risksContainer.innerHTML = '';

      if (data.risks && data.risks.length > 0) {
        data.risks.forEach(r => {
          const card = document.createElement('div');
          card.className = `card risk-${r.level === 'high' ? 'high' : (r.level === 'med' || r.level === 'medium' ? 'medium' : 'low')}`;
          card.innerHTML = `
            <strong>Пункт договора / Риск:</strong> ${r.clause || 'Общее замечание'}<br>
            <strong>Комментарий юриста:</strong> ${r.comment}<br>
            ${r.proposed ? `<br><strong>Рекомендуемая правка:</strong> ${r.proposed}` : ''}
          `;
          risksContainer.appendChild(card);
        });
      } else {
        risksContainer.innerHTML = '<div class="card">Существенных рисков не обнаружено.</div>';
      }

      document.getElementById('result-section').style.display = 'block';
    } catch (err) {
      alert("Ошибка при вызове сервера: " + err);
    } finally {
      btn.disabled = false;
      btn.innerText = "Анализировать";
    }
  });

  // Отправка отзыва
  document.getElementById('send-feedback-btn').addEventListener('click', async () => {
    const comment = document.getElementById('feedback-comment').value;
    const statusText = document.getElementById('feedback-status');

    const payload = {
      category: feedbackCategory,
      rating: selectedRating,
      thumb: selectedThumb,
      comment: comment
    };

    try {
      const resp = await fetch('/api/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });

      if (resp.ok) {
        statusText.style.color = '#276749';
        statusText.innerText = 'Спасибо! Ваш отзыв успешно отправлен.';
        statusText.style.display = 'block';

        // Сброс формы обратной связи
        document.getElementById('feedback-comment').value = '';
        selectedRating = 0;
        selectedThumb = null;
        document.querySelectorAll('.star').forEach(s => s.classList.remove('active'));
        document.getElementById('thumb-up').classList.remove('active');
        document.getElementById('thumb-down').classList.remove('active');
      } else {
        throw new Error('Ошибка при сохранении');
      }
    } catch (e) {
      statusText.style.color = '#c53030';
      statusText.innerText = 'Не удалось отправить отзыв. Попробуйте еще раз.';
      statusText.style.display = 'block';
    }
  });
</script>

</body>
</html>
