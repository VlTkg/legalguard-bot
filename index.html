<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LegalGuard — Экспресс-Анализ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #f4f5f7);
            --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #1c1e21);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --button-color: var(--tg-theme-button-color, #248277);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --border-color: rgba(142, 142, 147, 0.2);
            --high-risk: #ff3b30;
            --med-risk: #ff9500;
            --low-risk: #34c759;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
        }

        .header {
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 22px;
            margin: 0 0 4px 0;
            font-weight: 700;
        }

        .header p {
            color: var(--hint-color);
            font-size: 13px;
            margin: 0;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-label {
            font-size: 11px;
            font-weight: 700;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: block;
        }

        .select-input, .input-area {
            width: 100%;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px;
            font-size: 14px;
            background: var(--card-bg);
            color: var(--text-color);
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            -webkit-user-select: text !important;
            user-select: text !important;
        }

        .select-input:focus, .input-area:focus {
            border-color: var(--button-color);
        }

        .select-input {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238e8e93' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            background-size: 16px;
        }

        /* Эстетичный контейнер загрузки файла */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 20px 16px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--button-color);
            background: rgba(36, 130, 119, 0.04);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .drop-icon {
            font-size: 28px;
            margin-bottom: 6px;
            display: block;
        }

        .drop-text-main {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .drop-text-sub {
            font-size: 11px;
            color: var(--hint-color);
            margin-top: 4px;
        }

        .file-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(36, 130, 119, 0.1);
            color: var(--button-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
        }

        .divider-container {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            color: var(--hint-color);
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .divider-container::before, .divider-container::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider-container span {
            padding: 0 10px;
        }

        .input-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .paste-btn {
            background: rgba(36, 130, 119, 0.1);
            border: none;
            color: var(--button-color);
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            padding: 4px 10px;
            border-radius: 6px;
            transition: background 0.2s;
        }

        .paste-btn:active {
            background: rgba(36, 130, 119, 0.2);
        }

        .main-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 12px rgba(36, 130, 119, 0.2);
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .summary-card {
            background-color: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .summary-card .number {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .summary-card .label {
            font-size: 11px;
            color: var(--hint-color);
            text-transform: uppercase;
            font-weight: 600;
        }

        .summary-card.high .number { color: var(--high-risk); }
        .summary-card.med .number { color: var(--med-risk); }
        .summary-card.low .number { color: var(--low-risk); }

        .risk-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 14px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
            border-left: 5px solid transparent;
        }

        .risk-card.high { border-left-color: var(--high-risk); }
        .risk-card.med { border-left-color: var(--med-risk); }
        .risk-card.low { border-left-color: var(--low-risk); }

        .risk-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .risk-badge {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: 700;
            color: #fff;
            text-transform: uppercase;
        }

        .badge-high { background-color: var(--high-risk); }
        .badge-med { background-color: var(--med-risk); }
        .badge-low { background-color: var(--low-risk); }

        .risk-body {
            font-size: 13px;
            line-height: 1.5;
        }

        .text-block {
            margin-top: 8px;
            padding: 8px 10px;
            background-color: rgba(0,0,0,0.03);
            border-radius: 8px;
            font-size: 12px;
        }

        .text-block-title {
            font-weight: 600;
            color: var(--hint-color);
            margin-bottom: 4px;
            font-size: 10px;
            text-transform: uppercase;
        }

        .copy-btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            margin-top: 10px;
            cursor: pointer;
        }

        #loading, #error {
            text-align: center;
            padding: 40px 20px;
            color: var(--hint-color);
            font-size: 15px;
        }
    </style>
</head>
<body>

    <div id="loading" style="display: none;">Анализируем договор...</div>
    <div id="error" style="display: none; color: var(--high-risk); text-align: center; padding: 20px;"></div>

    <!-- 1. Главный экран -->
    <div id="input-screen">
        <div class="header">
            <h1>LegalGuard</h1>
            <p>Параметры и документ для экспресс-анализа</p>
        </div>

        <div class="form-group">
            <label class="form-label">Юрисдикция</label>
            <select id="jurisdiction-select" class="select-input">
                <option value="RU">Российская Федерация (РФ)</option>
                <option value="KZ">Республика Казахстан (РК)</option>
                <option value="UAE">ОАЭ / Международное право</option>
                <option value="OTHER">Общие правовые нормы (General)</option>
            </select>
        </div>

        <div class="form-group">
            <label class="form-label">Тип договора</label>
            <select id="category-select" class="select-input">
                <option value="freelance">Фриланс / Оказание услуг / ГПХ</option>
                <option value="it_dev">Разработка ПО / IT-услуги</option>
                <option value="nda">Соглашение о конфиденциальности (NDA)</option>
                <option value="rent">Аренда недвижимости / Оборудования</option>
                <option value="supply">Поставка / Купля-продажа</option>
                <option value="general">Другой тип договора</option>
            </select>
        </div>

        <!-- Красивый стилизованный блок загрузки файла -->
        <div class="form-group">
            <label class="form-label">Файл договора</label>
            <div class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" accept=".pdf,.docx,.doc,.txt" onchange="handleFileSelect(this)">
                <span class="drop-icon">📂</span>
                <div class="drop-text-main">Выберите файл или перетащите сюда</div>
                <div class="drop-text-sub">Поддерживаются PDF, DOCX, TXT</div>
                <div id="file-badge-container"></div>
            </div>
        </div>

        <div class="divider-container">
            <span>или</span>
        </div>

        <!-- Ввод и вставка текста -->
        <div class="form-group">
            <div class="input-header">
                <label class="form-label" style="margin:0;">Текст договора</label>
                <button type="button" class="paste-btn" onclick="pasteFromClipboard()">📋 Вставить из буфера</button>
            </div>
            <textarea id="doc-text-input" class="input-area" rows="6" placeholder="Вставьте текст или отдельные пункты (Ctrl+V или правая кнопка мыши)..." spellcheck="false"></textarea>
        </div>
        
        <button class="main-btn" onclick="startAnalysis()">🔍 Проверить договор</button>
    </div>

    <!-- 2. Экран результатов -->
    <div id="report-screen" style="display: none;">
        <div class="header" style="display: flex; justify-content: space-between; align-items: center;">
            <div>
                <h1 id="doc-title">Договор</h1>
                <p id="doc-meta" style="font-size: 12px; color: var(--hint-color);"></p>
            </div>
            <button onclick="resetToInput()" style="background: none; border: 1px solid var(--border-color); padding: 6px 12px; border-radius: 8px; font-size: 12px; color: var(--text-color); cursor: pointer;">Новая проверка</button>
        </div>

        <div class="summary-cards">
            <div class="summary-card high">
                <div class="number" id="count-high">0</div>
                <div class="label">Высокие</div>
            </div>
            <div class="summary-card med">
                <div class="number" id="count-med">0</div>
                <div class="label">Средние</div>
            </div>
            <div class="summary-card low">
                <div class="number" id="count-low">0</div>
                <div class="label">Низкие</div>
            </div>
        </div>

        <div style="font-size: 15px; font-weight: 700; margin: 20px 0 12px 0;">Детальный разбор рисков</div>
        <div id="risks-list"></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get('user_id') || (tg.initDataUnsafe.user ? tg.initDataUnsafe.user.id : '123456');

        // Обработка выбора файла
        function handleFileSelect(input) {
            const container = document.getElementById('file-badge-container');
            if (input.files && input.files[0]) {
                const name = input.files[0].name;
                container.innerHTML = `<div class="file-badge">📄 ${escapeHtml(name)}</div>`;
            } else {
                container.innerHTML = '';
            }
        }

        // Продвинутая функция вставки из буфера обмена (для ПК и Смартфонов)
        async function pasteFromClipboard() {
            const textarea = document.getElementById('doc-text-input');
            textarea.focus();

            try {
                // Попытка системного Clipboard API
                const text = await navigator.clipboard.readText();
                if (text) {
                    textarea.value = text;
                    if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
                } else {
                    alert("Буфер обмена пуст.");
                }
            } catch (err) {
                // Фоллбек для Telegram Desktop
                try {
                    const successful = document.execCommand('paste');
                    if (!successful && !textarea.value) {
                        alert("Нажмите Ctrl + V (или Cmd + V на Mac) для вставки текста в поле.");
                    }
                } catch (e) {
                    alert("Нажмите Ctrl + V (или Cmd + V на Mac) для вставки текста.");
                }
            }
        }

        // Поддержка Drag & Drop для компьютера
        const dropZone = document.getElementById('drop-zone');
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.add('dragover');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, (e) => {
                e.preventDefault();
                dropZone.classList.remove('dragover');
            }, false);
        });

        dropZone.addEventListener('drop', (e) => {
            const dt = e.dataTransfer;
            const files = dt.files;
            const fileInput = document.getElementById('file-input');
            fileInput.files = files;
            handleFileSelect(fileInput);
        });

        async function startAnalysis() {
            const text = document.getElementById('doc-text-input').value.trim();
            const fileInput = document.getElementById('file-input');
            const jurisdiction = document.getElementById('jurisdiction-select').value;
            const category = document.getElementById('category-select').value;

            if (!text && (!fileInput.files || fileInput.files.length === 0)) {
                alert("Пожалуйста, загрузите файл договора или вставьте его текст.");
                return;
            }

            document.getElementById('input-screen').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            const formData = new FormData();
            formData.append('user_id', userId);
            formData.append('jurisdiction', jurisdiction);
            formData.append('category', category);

            if (fileInput.files && fileInput.files[0]) {
                formData.append('file', fileInput.files[0]);
            } else {
                formData.append('text', text);
            }

            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error("Ошибка обработки документа.");

                const data = await response.json();
                renderReport(data, jurisdiction, category);
            } catch (err) {
                document.getElementById('loading').style.display = 'none';
                document.getElementById('error').innerText = err.message;
                document.getElementById('error').style.display = 'block';
            }
        }

        function resetToInput() {
            document.getElementById('report-screen').style.display = 'none';
            document.getElementById('error').style.display = 'none';
            document.getElementById('input-screen').style.display = 'block';
            document.getElementById('file-input').value = '';
            document.getElementById('file-badge-container').innerHTML = '';
            document.getElementById('doc-text-input').value = '';
        }

        function renderReport(data, jur, cat) {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('report-screen').style.display = 'block';

            const categoryLabels = {
                'freelance': 'Фриланс / ГПХ',
                'it_dev': 'IT / Разработка',
                'nda': 'NDA',
                'rent': 'Аренда',
                'supply': 'Поставка',
                'general': 'Общий договор'
            };

            document.getElementById('doc-title').innerText = data.doc_title || 'Анализ Договора';
            document.getElementById('doc-meta').innerText = `Юрисдикция: ${jur} | Тип: ${categoryLabels[cat] || cat}`;

            document.getElementById('count-high').innerText = data.summary ? (data.summary.high || 0) : 0;
            document.getElementById('count-med').innerText = data.summary ? (data.summary.medium || 0) : 0;
            document.getElementById('count-low').innerText = data.summary ? (data.summary.low || 0) : 0;

            const listContainer = document.getElementById('risks-list');
            listContainer.innerHTML = '';

            if (!data.risks || data.risks.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color: var(--hint-color); padding: 20px;">Критических рисков не обнаружено.</div>';
                return;
            }

            data.risks.forEach((risk) => {
                const card = document.createElement('div');
                card.className = `risk-card ${risk.level}`;

                const levelText = risk.level === 'high' ? 'Высокий risk' : (risk.level === 'med' ? 'Средний risk' : 'Низкий risk');
                const badgeClass = `badge-${risk.level}`;

                card.innerHTML = `
                    <div class="risk-header">
                        <span>Пункт: ${escapeHtml(risk.clause)}</span>
                        <span class="risk-badge ${badgeClass}">${levelText}</span>
                    </div>
                    <div class="risk-body">
                        <div style="margin-bottom: 6px;">${escapeHtml(risk.comment)}</div>
                        <div class="text-block">
                            <div class="text-block-title">Исходная формулировка:</div>
                            <i>"${escapeHtml(risk.original)}"</i>
                        </div>
                        <div class="text-block">
                            <div class="text-block-title">Предлагаемая правка:</div>
                            <b>"${escapeHtml(risk.proposed)}"</b>
                        </div>
                    </div>
                `;
                listContainer.appendChild(card);
            });
        }

        function escapeHtml(str) {
            return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
